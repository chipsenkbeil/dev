[package]
name = "dev"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
crossterm = "0.29"
fs4 = "0.13"
include_dir = "0.7"
mlua = { version = "0.12", features = ["luau"] }
rustls-platform-verifier = "0.7"
serde_json = "1"
sha2 = "0.10"
toml = "1"
ureq = { version = "3", default-features = false, features = ["gzip", "platform-verifier", "rustls"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "net", "process", "stdio", "termios"] }
signal-hook = { version = "0.3", features = ["extended-siginfo"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[lints.rust]
elided_lifetimes_in_paths = "deny"
missing_debug_implementations = "deny"
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
double_must_use = "deny"
elidable_lifetime_names = "deny"
fn_params_excessive_bools = "deny"
io_other_error = "deny"
items_after_test_module = "deny"
missing_safety_doc = "deny"
mod_module_files = "deny"
multiple_unsafe_ops_per_block = "deny"
must_use_unit = "deny"
needless_lifetimes = "deny"
non_std_lazy_statics = "deny"
return_self_not_must_use = "deny"
struct_excessive_bools = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
wrong_self_convention = "deny"
