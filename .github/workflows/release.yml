name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DEV_RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: build x86_64-unknown-linux-musl
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - name: Add the Rust target
        run: rustup target add "$TARGET"
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build the release binary
        run: cargo zigbuild --release --locked --target "$TARGET"
      - name: Test the release binary
        run: |
          binary=target/$TARGET/release/dev
          ./$binary release test $binary --tag "$DEV_RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: dev-${{ github.ref_name }}-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/dev
          if-no-files-found: error

  build-macos:
    name: build both macOS targets
    runs-on: macos-26
    env:
      ARM: aarch64-apple-darwin
      INTEL: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - name: Add the Rust targets
        run: rustup target add "$ARM" "$INTEL"
      - name: Require Rosetta
        run: arch -x86_64 /usr/bin/true
      - name: Build the aarch64 binary
        run: cargo build --release --locked --target "$ARM"
      - name: Build the x86_64 binary
        run: ./target/$ARM/release/dev release build "$INTEL" --tag "$DEV_RELEASE_TAG"
      - name: Test the aarch64 binary
        run: |
          binary=target/$ARM/release/dev
          ./$binary release test $binary --tag "$DEV_RELEASE_TAG"
      - name: Test the x86_64 binary under Rosetta
        run: |
          binary=target/$INTEL/release/dev
          arch -x86_64 ./$binary release test $binary --tag "$DEV_RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: dev-${{ github.ref_name }}-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/dev
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: dev-${{ github.ref_name }}-x86_64-apple-darwin
          path: target/x86_64-apple-darwin/release/dev
          if-no-files-found: error

  build-freebsd:
    name: build x86_64-unknown-freebsd
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Build and test inside FreeBSD
        uses: vmactions/freebsd-vm@v1.6.0
        with:
          release: '15.1'
          arch: x86_64
          envs: DEV_RELEASE_TAG
          prepare: |
            pkg install -y rustup-init
            rustup-init -y --default-toolchain none --profile minimal
          run: |
            set -e
            export PATH="$HOME/.cargo/bin:$PATH"
            target=x86_64-unknown-freebsd
            cargo build --release --locked --target "$target"
            binary=target/$target/release/dev
            pw useradd tester -m
            chown -R tester .
            su tester -c "cd $PWD && ./$binary release test $binary --tag $DEV_RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: dev-${{ github.ref_name }}-x86_64-unknown-freebsd
          path: target/x86_64-unknown-freebsd/release/dev
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, build-macos, build-freebsd]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish the release
        run: |
          dev=artifacts/dev-$DEV_RELEASE_TAG-x86_64-unknown-linux-musl/dev
          chmod +x "$dev"
          "./$dev" release publish "$DEV_RELEASE_TAG" --dir artifacts
